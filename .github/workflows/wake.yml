# Wakes the free Render service on weekdays, shortly before the cron-job.org health pings
# start at 08:00 Zagreb time. A free instance sleeps after 15 minutes idle, and its cold start
# fails a ping that has a 30 s timeout and a response size limit. This request waits and
# retries until the service itself answers.
#
# GitHub schedules in UTC and has no daylight saving, so there is one line per season:
# 05:50 UTC is 07:50 in summer and 06:50 UTC is 07:50 in winter. The other line of each
# season is a spare ping. Scheduled runs can start several minutes late.
name: Wake Prometej

on:
  schedule:
    - cron: "50 5 * * 1-5"
    - cron: "50 6 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: >
          curl --fail --silent --show-error --output /dev/null
          --max-time 90 --retry 5 --retry-delay 10 --retry-all-errors
          https://prometej.onrender.com/healthz
